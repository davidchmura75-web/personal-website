<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume &mdash; John Doe</title>
    <meta name="author" content="John Doe">
    <link rel="stylesheet" href="layout.css">
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <script src="main.js" defer></script>
  </head>
  <body data-page="resume">
    <nav class="rail rail-left" aria-label="Primary" data-nav></nav>
    <nav class="rail rail-right" aria-label="Preferences" data-theme-rail></nav>

    <div class="view">
      <main class="main">
        <div>
          Test test sahur
        </div>

        <!-- Drop the file in as media/resume.pdf, or point these two paths elsewhere. -->
        <section class="pdf-block">
          <object class="pdf-embed" data="media/resume.pdf" type="application/pdf">
            <div class="pdf-fallback">
              <p>This PDF can't be shown inline here.</p>
            </div>
          </object>

          <p class="pdf-actions">
            <a class="pdf-download" href="media/resume.pdf" target="_blank" rel="noopener">
              Open the PDF in a new tab
            </a>
          </p>
        </section>
      </main>

      <footer class="foot">
        <span class="legal">&copy; 2026 John Doe</span>
      </footer>
    </div>
  </body>
</html>
